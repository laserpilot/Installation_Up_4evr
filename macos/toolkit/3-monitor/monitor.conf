# ============================================================================
#  Up 4evr — monitor.conf   (Module 3 config)
# ============================================================================
#  Plain shell KEY=value. monitor.sh reads this. Leave a value blank to skip
#  that check. No quotes needed unless the value contains spaces.
# ============================================================================

# ---- the app this machine should always be running --------------------------
# A distinctive part of the app/process name. Blank = don't check any app.
# Example: APP_NAME="MyShow"
APP_NAME=""

# ---- display watch ----------------------------------------------------------
# A string that must appear in the connected-display list, e.g. a resolution
# width like 1920 or 3840. Blank = don't check displays.
EXPECTED_DISPLAY=""

# ---- alert thresholds (percent) ---------------------------------------------
CPU_THRESHOLD=90        # alert if system CPU usage is above this
DISK_THRESHOLD=90       # alert if the boot disk is fuller than this

# ---- settings-drift check (reuses Module 1) ---------------------------------
ALERT_ON_DRIFT=1        # 1 = run ../1-system-settings/check-settings.sh and alert on drift
# Path to Module 1. Default is the sibling folder; override if you moved things.
SETTINGS_DIR=""

# ---- Slack ------------------------------------------------------------------
# Incoming-webhook URL. Blank = log only, no Slack.
SLACK_WEBHOOK=""
SLACK_USERNAME="Up 4evr"
SLACK_ICON=":satellite_antenna:"

# ---- daily summary ----------------------------------------------------------
# Send a "still alive" heartbeat to Slack once a day even when all is well,
# at this hour (24h local). Blank = no daily heartbeat.
DAILY_SUMMARY_HOUR=9

# ---- logging ----------------------------------------------------------------
# Where the rolling status log is written. Default: ~/Library/Logs/up4evr
LOG_DIR=""
