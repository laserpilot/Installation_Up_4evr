# ============================================================================
#  Up 4evr — macOS System Settings  (Module 1 config)
# ============================================================================
#  Turn settings ON (1) or OFF (0). check-settings.sh and apply-settings.sh
#  both read this file. Anything set to 0 is skipped entirely.
#
#  This file is plain shell `KEY=value`. Edit in any text editor.
#  Lines starting with # are comments.
#
#  DANGER ZONE settings are 0 by default and weaken system security — only
#  enable them if you understand the consequences (see notes by each one).
# ============================================================================

# ---- power / sleep (the essentials for an always-on install) ----------------
SET_screensaver=1            # disable screensaver (idleTime 0)
SET_display_sleep=1          # never sleep the display (pmset -c displaysleep 0)
SET_computer_sleep=1         # never sleep the computer (pmset -c sleep 0)
SET_restart_freeze=1         # auto-restart if the system freezes
SET_power_autorestart=1      # auto-restart after a power failure

# ---- user interface ---------------------------------------------------------
SET_do_not_disturb=1         # silence notifications (Focus / DND)
SET_hide_menubar=1           # auto-hide the menu bar
SET_hide_desktop_icons=1     # hide desktop icons (restarts Finder)
SET_autohide_dock=1          # auto-hide the Dock (restarts Dock)
SET_disable_stage_manager=1  # disable Stage Manager (Ventura+)

# ---- system / hardware ------------------------------------------------------
SET_bluetooth_assistant=1    # stop the Bluetooth Setup Assistant popup
SET_disable_wifi_prompt=1    # stop "Ask to join new networks" prompts

# ---- performance ------------------------------------------------------------
SET_disable_app_nap=1        # stop macOS throttling background apps
SET_disable_spotlight=0      # disable Spotlight indexing (off by default — re-enabling costs a reindex)

# ---- software updates -------------------------------------------------------
SET_disable_auto_updates=1   # disable automatic macOS update download/check
SET_disable_appstore_updates=1  # disable automatic App Store updates

# ============================================================================
#  DANGER ZONE — all 0 by default. These reduce security. Enable knowingly.
# ============================================================================
SET_disable_gatekeeper=0     # DANGER: allow unsigned apps (spctl --master-disable)
SET_disable_crash_reporter=0 # DANGER: requires SIP disabled; hides crash dialogs
SET_enable_auto_login=0      # DANGER: auto-login current user (no login password)
