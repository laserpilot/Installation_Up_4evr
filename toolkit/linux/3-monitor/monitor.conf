# ============================================================================
#  Up 4evr — Linux monitor.conf   (Module 3 config)
# ============================================================================
#  Plain shell KEY=value. Blank value = skip that check.
# ============================================================================

# The app/process this machine should always be running (a distinctive part of
# the command or process name). Blank = don't check. Example: APP_NAME=chromium
APP_NAME=""

# A string that must appear in the connected-display list (needs xrandr), e.g. a
# resolution width like 1920. Blank = skip.
EXPECTED_DISPLAY=""

# alert thresholds (percent)
CPU_THRESHOLD=90
DISK_THRESHOLD=90

# settings-drift check (reuses Module 1). 1 = on.
ALERT_ON_DRIFT=1
# Path to Module 1. Blank = the sibling ../1-system-settings folder.
SETTINGS_DIR=""

# Slack incoming webhook. Blank = log only.
SLACK_WEBHOOK=""
SLACK_USERNAME="Up 4evr"
SLACK_ICON=":satellite_antenna:"

# Send a daily "healthy" heartbeat at this hour (0-23). Blank = none.
DAILY_SUMMARY_HOUR=9

# Where to write the rolling log. Blank = ~/.local/state/up4evr
LOG_DIR=""
