# ============================================================================
#  Up 4evr — Windows System Settings  (Module 1 config)
# ============================================================================
#  1 = manage this setting, 0 = leave it alone. check + apply both read this.
#  Plain text, one per line. Lines starting with # are comments.
#
#  DANGER settings are 0 by default and weaken security / lock the machine
#  down hard. Enable knowingly.
# ============================================================================

# ---- power / sleep ----------------------------------------------------------
SET_power_highperf=1        # High Performance power plan
SET_display_sleep=1         # never turn off the display
SET_computer_sleep=1        # never sleep the computer
SET_hibernate=1             # disable hibernation
SET_screensaver=1           # disable screensaver
SET_lock_timeout=1          # disable inactivity lock

# ---- windows UI -------------------------------------------------------------
SET_notification_center=1   # disable Action Center / notifications
SET_toast=1                 # disable toast pop-ups
SET_cortana=1               # disable Cortana
SET_copilot=1               # disable Windows Copilot
SET_widgets=1               # disable taskbar widgets
SET_sticky_keys=1           # disable Sticky Keys prompt
SET_filter_keys=1           # disable Filter Keys prompt
SET_toggle_keys=1           # disable Toggle Keys prompt
SET_taskbar_autohide=0      # auto-hide taskbar (restarts Explorer) — off by default
SET_disable_win_key=0       # disable the Windows logo key — off by default (blocks maintenance shortcuts)

# ---- touch / gestures -------------------------------------------------------
SET_edge_swipe=1            # disable edge swipe
SET_touch_gestures=1        # disable 3/4-finger touchpad gestures
SET_touch_feedback=1        # disable touch visual ripples

# ---- updates ----------------------------------------------------------------
SET_disable_updates=1       # disable automatic Windows Update

# ---- maintenance ------------------------------------------------------------
SET_weekly_reboot=0         # schedule a weekly reboot (Mon 03:00) — off by default

# ---- services ---------------------------------------------------------------
SET_disable_onedrive=0      # disable OneDrive sync + startup — off by default

# ============================================================================
#  DANGER ZONE — off by default.
# ============================================================================
SET_auto_logon=0            # DANGER: auto-logon; stores the password in cleartext
