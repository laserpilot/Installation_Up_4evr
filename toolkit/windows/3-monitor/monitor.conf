# ============================================================================
#  Up 4evr — Windows monitor.conf   (Module 3 config)
# ============================================================================
#  KEY=value, one per line. Blank value = skip that check.
# ============================================================================

# The app this machine should always be running (process or .exe name, with or
# without .exe). Blank = don't check. Example: APP_NAME=MyShow
APP_NAME=

# A display width that must be present, e.g. 1920 or 3840. Blank = skip.
EXPECTED_DISPLAY=

# alert thresholds (percent)
CPU_THRESHOLD=90
DISK_THRESHOLD=90

# settings-drift check (reuses Module 1). 1 = on.
ALERT_ON_DRIFT=1
# Path to Module 1. Blank = the sibling ..\1-system-settings folder.
SETTINGS_DIR=

# Slack incoming webhook. Blank = log only.
SLACK_WEBHOOK=
SLACK_USERNAME=Up 4evr
SLACK_ICON=:satellite_antenna:

# Send a daily "healthy" heartbeat at this hour (0-23). Blank = none.
DAILY_SUMMARY_HOUR=9

# Where to write the rolling log. Blank = %ProgramData%\up4evr
LOG_DIR=
