# ============================================================================
#  Up 4evr — Linux (Ubuntu/GNOME) System Settings  (Module 1 config)
# ============================================================================
#  1 = manage this setting, 0 = leave it alone. check + apply both read this.
#  Plain shell KEY=value. Lines starting with # are comments.
#
#  gsettings values apply to the user running the script; run inside the
#  GNOME session. DANGER settings are 0 by default.
# ============================================================================

# ---- power / sleep ----------------------------------------------------------
SET_screen_blank=1          # never blank the screen (idle-delay 0)
SET_idle_dim=1              # never dim the screen
SET_sleep_ac=1             # never auto-suspend on AC
SET_sleep_battery=1         # never auto-suspend on battery
SET_screensaver_lock=1      # disable screen lock
SET_screensaver_idle=1      # disable screensaver activation
SET_system_sleep=1          # mask systemd sleep/suspend targets (root)

# ---- user interface ---------------------------------------------------------
SET_notifications=1         # disable notification banners

# ---- performance ------------------------------------------------------------
SET_disable_apport=1        # disable the apport crash reporter (root)

# ---- software updates -------------------------------------------------------
SET_disable_auto_updates=1  # disable unattended-upgrades (root)

# ============================================================================
#  DANGER ZONE — off by default. Assumes GDM3.
# ============================================================================
SET_auto_login=0            # DANGER: auto-login the current user
